services:
  pipeline:
    build: .
    container_name: unifor_pipeline
    command: >
      bash -c "python src/ingest_enade.py && 
               python src/ingest_emec.py && 
               python src/process_silver.py && 
               mkdir -p data/gold && 
               cd dbt_enade && dbt clean && dbt run"
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    container_name: unifor_dashboard
    command: streamlit run app/main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      pipeline:
        condition: service_completed_successfully